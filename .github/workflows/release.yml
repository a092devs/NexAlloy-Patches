name: Release

on:
  push:
    tags:
      - '*.*.*'
  # Releases the selected ref under a new tag, e.g. when tags cannot be pushed.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, X.Y.Z or X.Y.Z-suffix for a pre-release'
        required: true
      delete:
        description: 'Also delete the releases and tags whose tag contains this text, e.g. -alpha'
        required: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: set up Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platforms;android-37 build-tools;37.0.0 platform-tools'

    - name: Build patch bundles
      run: ./gradlew assembleBundle

    - name: Verify generated bundles
      run: |
        ls -la bundles/*/build/outputs/bundle/*.nxb
        count=$(ls -1 bundles/*/build/outputs/bundle/*.nxb 2>/dev/null | wc -l)
        if [ "$count" -eq 0 ]; then
          echo "Error: No .nxb patch bundles were generated for release!" >&2
          exit 1
        fi
        for f in bundles/*/build/outputs/bundle/*.nxb; do
          if [ ! -s "$f" ]; then
            echo "Error: Release bundle artifact $f is empty!" >&2
            exit 1
          fi
          echo "Verified non-empty release bundle: $f ($(stat -c%s "$f") bytes)"
        done

    # NexAlloy installs every .nxb asset of the latest release of a patch source.
    - name: Create release
      run: |
        FLAGS=""
        # Tags like 1.0.0-beta are pre-releases.
        if [[ "${{ env.TAG }}" == *-* ]]; then FLAGS="--prerelease"; fi
        gh release create ${{ env.TAG }} bundles/*/build/outputs/bundle/*.nxb $FLAGS --target "${{ github.sha }}" --title "${{ env.TAG }}" --generate-notes
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Delete superseded releases
      if: inputs.delete != ''
      run: |
        gh release list --limit 200 --json tagName --jq '.[].tagName' > tags
        for tag in $(grep -F -- "$PATTERN" tags | grep -vxF -- "$TAG" || true); do
          gh release delete "$tag" --cleanup-tag --yes
        done
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PATTERN: ${{ inputs.delete }}
