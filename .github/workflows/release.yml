name: Release

on:
    workflow_dispatch:
        inputs:
            tag:
                description: 'Release version (e.g. 1.0.0)'
                required: true
                type: string
    push:
        tags:
            - '*.*.*'

permissions:
    contents: write

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    build-and-release:
        name: Build and publish NXB bundles
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
              with:
                  submodules: recursive

            - name: Set up Java
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: '21'
                  cache: gradle

            - name: Set up Android SDK
              uses: android-actions/setup-android@v4
              with:
                  packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

            - name: Determine release tag
              id: release
              shell: bash
              env:
                  INPUT_TAG: ${{ inputs.tag }}
                  EVENT_NAME: ${{ github.event_name }}
                  REF_NAME: ${{ github.ref_name }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
                    tag="$INPUT_TAG"
                  else
                    tag="$REF_NAME"
                  fi

                  if [[ ! "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
                    echo "::error::Invalid release tag: $tag"
                    exit 1
                  fi

                  # Prevent accidental overwrites and duplicate release tags
                  if gh release view "$tag" >/dev/null 2>&1; then
                    echo "::error::Release $tag already exists on remote; duplicate releases and accidental overwrites are rejected."
                    exit 1
                  fi

                  # Prevent conflicting version assignments: verify tag matches NexFusion versionName
                  bundle_version="$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' bundles/nexfusion/build.gradle.kts | head -n1)"
                  if [[ -n "$bundle_version" && "$tag" != "$bundle_version"* ]]; then
                    echo "::error::Conflicting version assignment: release tag $tag does not match NexFusion bundle versionName $bundle_version"
                    exit 1
                  fi

                  echo "tag=$tag" >> "$GITHUB_OUTPUT"

            - name: Unit tests
              run: ./gradlew testDebugUnitTest

            - name: Build bundles
              run: ./gradlew assembleBundle --stacktrace

            - name: Verify generated bundles
              shell: bash
              run: |
                  shopt -s nullglob
                  files=(bundles/*/build/outputs/bundle/*.nxb)

                  if (( ${#files[@]} == 0 )); then
                    echo "::error::Build completed but no .nxb files were found."
                    find bundles -type f -path '*/build/outputs/*' -print
                    exit 1
                  fi

                  # Verify NexFusion bundle was built
                  nexfusion_files=(bundles/nexfusion/build/outputs/bundle/*.nxb)
                  if (( ${#nexfusion_files[@]} == 0 )); then
                    echo "::error::NexFusion bundle (nexfusion.nxb) was not generated."
                    exit 1
                  fi

                  mkdir -p release-assets

                  for file in "${files[@]}"; do
                    if [[ ! -s "$file" ]]; then
                      echo "::error::Bundle is empty: $file"
                      exit 1
                    fi

                    cp "$file" release-assets/
                    echo "Verified: $file ($(stat -c%s "$file") bytes)"
                  done

                  echo "Generated ${#files[@]} bundle(s):"
                  ls -lh release-assets/

            - name: Generate release notes
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ steps.release.outputs.tag }}
              run: |
                  set -euo pipefail

                  # Prefer the curated section for this tag from CHANGELOG.md and fall back to the
                  # generated commit notes when the changelog has no section for the tag yet.
                  section=""
                  if [[ -f CHANGELOG.md ]]; then
                    section="$(awk -v tag="$TAG" '
                      /^## / {
                        if (found) exit
                        rest = substr($0, 4)
                        sub(/[ \t].*$/, "", rest)
                        if (rest == tag) found = 1
                        next
                      }
                      found { print }
                    ' CHANGELOG.md)"
                  fi

                  if [[ -n "${section//[[:space:]]/}" ]]; then
                    printf '%s\n' "$section" > release-notes.md
                  else
                    gh api \
                      "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
                      -f "tag_name=$TAG" \
                      -f "target_commitish=$GITHUB_SHA" \
                      --jq '.body' > release-notes.md
                  fi

                  # Append machine-readable and human-readable compatibility metadata
                  compat_series="$(sed -nE 's/.*compatibilitySeries = "([^"]+)".*/\1/p' bundles/nexfusion/build.gradle.kts | head -n1)"
                  min_mgr="$(sed -nE 's/.*minManagerVersion = "([^"]+)".*/\1/p' bundles/nexfusion/build.gradle.kts | head -n1)"
                  if [[ -n "$compat_series" ]]; then
                    {
                      echo ""
                      echo "### Compatibility"
                      echo "- **NexAlloyNext Series:** \`$compat_series\` (minimum manager version: \`$min_mgr\`)"
                      echo "<!-- compat-series: $compat_series -->"
                      echo "<!-- min-manager: $min_mgr -->"
                    } >> release-notes.md
                  fi

            - name: Publish GitHub Release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ steps.release.outputs.tag }}
              shell: bash
              run: |
                  shopt -s nullglob
                  assets=(release-assets/*.nxb)

                  if (( ${#assets[@]} == 0 )); then
                    echo "::error::No verified NXB assets available to publish."
                    exit 1
                  fi

                  flags=()
                  if [[ "$TAG" == *-* ]]; then
                    flags+=(--prerelease)
                  fi

                  gh release create "$TAG" \
                    "${assets[@]}" \
                    "${flags[@]}" \
                    --target "$GITHUB_SHA" \
                    --title "$TAG" \
                    --notes-file release-notes.md
