name: Release

on:
    workflow_dispatch:
        inputs:
            tag:
                description: 'Release version (e.g. 1.0.0)'
                required: true
                type: string
    push:
        tags:
            - '*.*.*'

permissions:
    contents: write

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    build-and-release:
        name: Build and publish NXB bundles
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
              with:
                  submodules: recursive

            - name: Set up Java
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: '21'
                  cache: gradle

            - name: Set up Android SDK
              uses: android-actions/setup-android@v4
              with:
                  packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

            - name: Unit tests
              run: ./gradlew testDebugUnitTest

            - name: Build bundles
              run: ./gradlew assembleBundle --stacktrace

            - name: Verify generated bundles
              shell: bash
              run: |
                  shopt -s nullglob
                  files=(bundles/*/build/outputs/bundle/*.nxb)

                  if (( ${#files[@]} == 0 )); then
                    echo "::error::Build completed but no .nxb files were found."
                    find bundles -type f -path '*/build/outputs/*' -print
                    exit 1
                  fi

                  mkdir -p release-assets

                  for file in "${files[@]}"; do
                    if [[ ! -s "$file" ]]; then
                      echo "::error::Bundle is empty: $file"
                      exit 1
                    fi

                    cp "$file" release-assets/
                    echo "Verified: $file ($(stat -c%s "$file") bytes)"
                  done

                  echo "Generated ${#files[@]} bundle(s):"
                  ls -lh release-assets/

            - name: Determine release tag
              id: release
              shell: bash
              env:
                  INPUT_TAG: ${{ inputs.tag }}
                  EVENT_NAME: ${{ github.event_name }}
                  REF_NAME: ${{ github.ref_name }}
              run: |
                  if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
                    tag="$INPUT_TAG"
                  else
                    tag="$REF_NAME"
                  fi

                  if [[ ! "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
                    echo "::error::Invalid release tag: $tag"
                    exit 1
                  fi

                  echo "tag=$tag" >> "$GITHUB_OUTPUT"

            - name: Generate release notes
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ steps.release.outputs.tag }}
              run: |
                  set -euo pipefail

                  # Prefer the curated section for this tag from CHANGELOG.md and fall back to the
                  # generated commit notes when the changelog has no section for the tag yet.
                  section=""
                  if [[ -f CHANGELOG.md ]]; then
                    section="$(awk -v tag="$TAG" '
                      /^## / {
                        if (found) exit
                        rest = substr($0, 4)
                        sub(/[ \t].*$/, "", rest)
                        if (rest == tag) found = 1
                        next
                      }
                      found { print }
                    ' CHANGELOG.md)"
                  fi

                  if [[ -n "${section//[[:space:]]/}" ]]; then
                    printf '%s\n' "$section" > release-notes.md
                  else
                    gh api \
                      "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
                      -f "tag_name=$TAG" \
                      -f "target_commitish=$GITHUB_SHA" \
                      --jq '.body' > release-notes.md
                  fi

            - name: Publish GitHub Release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ steps.release.outputs.tag }}
              shell: bash
              run: |
                  shopt -s nullglob
                  assets=(release-assets/*.nxb)

                  if (( ${#assets[@]} == 0 )); then
                    echo "::error::No verified NXB assets available to publish."
                    exit 1
                  fi

                  if gh release view "$TAG" >/dev/null 2>&1; then
                    gh release upload "$TAG" "${assets[@]}" --clobber
                  else
                    flags=()

                    if [[ "$TAG" == *-* ]]; then
                      flags+=(--prerelease)
                    fi

                    gh release create "$TAG" \
                      "${assets[@]}" \
                      "${flags[@]}" \
                      --target "$GITHUB_SHA" \
                      --title "$TAG" \
                      --notes-file release-notes.md
                  fi
